  <rect class="bg" x="1" y="1" width="1178" height="1134" rx="6"/>
  <text class="ttl" x="40" y="46">Diagram 5 - Three Fadecandy boards for all eighteen runs</text>
  <text class="sub" x="40" y="72">24 channels available, 18 used. fcserver tells the boards apart by USB serial number, so the mapping survives reboots and re-plugging.</text>

  <rect class="pan" x="40" y="96" width="1100" height="580" rx="6"/>
  <text class="panttl" x="66" y="126">The whole chain, end to end</text>
  <text class="lbls" x="66" y="145">Only USB leaves the Pi. Only DATA and its GND leave each Fadecandy. All strip current stays between a supply and the runs it feeds.</text>
  <rect class="box" x="66" y="280" width="150" height="100" rx="5"/>
  <text class="wlbl" x="141" y="308" text-anchor="middle">Raspberry Pi</text>
  <text class="wlbl" x="141" y="324" text-anchor="middle">3 Model B+</text>
  <text class="tiny" x="141" y="344" text-anchor="middle">runs fcserver</text>
  <text class="tiny" x="141" y="360" text-anchor="middle">own 5 V PSU, 2.5 A</text>
  <path class="usbc" d="M 216 330 H 286"/>
  <path class="usb"  d="M 220 330 H 282"/>
  <text class="tiny" x="251" y="321" text-anchor="middle">USB</text>
  <rect class="box" x="286" y="250" width="150" height="160" rx="5"/>
  <text class="wlbl" x="361" y="278" text-anchor="middle">POWERED</text>
  <text class="wlbl" x="361" y="294" text-anchor="middle">USB hub</text>
  <text class="tiny" x="361" y="316" text-anchor="middle">its own mains</text>
  <text class="tiny" x="361" y="330" text-anchor="middle">adapter - that is</text>
  <text class="tiny" x="361" y="344" text-anchor="middle">the whole point</text>
  <text class="tiny" x="361" y="366" text-anchor="middle">also a repeater: a</text>
  <text class="tiny" x="361" y="380" text-anchor="middle">fresh 5 m segment</text>
  <text class="tiny" x="361" y="394" text-anchor="middle">starts here</text>
  <path class="mains" d="M 361 250 V 212"/>
  <text class="tiny" x="368" y="210">mains</text>
  <path class="usbc" d="M 436 330 C 476 330, 476 214, 516 214"/>
  <path class="usb"  d="M 438 330 C 476 330, 476 214, 514 214"/>
  <rect class="fcb" x="516" y="168" width="256" height="92" rx="5"/>
  <text class="wlbl" x="532" y="190">Fadecandy A</text>
  <text class="tiny" x="532" y="208">ch 0-7 &#8594; runs 1-8</text>
  <text class="tiny" x="532" y="224">OPC px 0-511</text>
  <rect class="code" x="530" y="230" width="228" height="20" rx="3"/>
  <text class="monos" x="536" y="244" xml:space="preserve">serial FFFFFFFFFFFF0018001720&#8230;</text>
  <path class="datc" d="M 772 214 H 856"/>
  <path class="dat"  d="M 772 214 H 856"/>
  <path class="usbc" d="M 436 330 C 476 330, 476 322, 516 322"/>
  <path class="usb"  d="M 438 330 C 476 330, 476 322, 514 322"/>
  <rect class="fcb" x="516" y="276" width="256" height="92" rx="5"/>
  <text class="wlbl" x="532" y="298">Fadecandy B</text>
  <text class="tiny" x="532" y="316">ch 0-3 &#8594; runs 9-12  (ch 4-7 unused)</text>
  <text class="tiny" x="532" y="332">OPC px 512-767</text>
  <rect class="code" x="530" y="338" width="228" height="20" rx="3"/>
  <text class="monos" x="536" y="352" xml:space="preserve">serial FFFFFFFFFFFF0021003B20&#8230;</text>
  <path class="datc" d="M 772 322 H 856"/>
  <path class="dat"  d="M 772 322 H 856"/>
  <path class="usbc" d="M 436 330 C 476 330, 476 430, 516 430"/>
  <path class="usb"  d="M 438 330 C 476 330, 476 430, 514 430"/>
  <rect class="fcb" x="516" y="384" width="256" height="92" rx="5"/>
  <text class="wlbl" x="532" y="406">Fadecandy C</text>
  <text class="tiny" x="532" y="424">ch 0-5 &#8594; runs 13-18</text>
  <text class="tiny" x="532" y="440">OPC px 768-1151</text>
  <rect class="code" x="530" y="446" width="228" height="20" rx="3"/>
  <text class="monos" x="536" y="460" xml:space="preserve">serial FFFFFFFFFFFF0034005220&#8230;</text>
  <path class="datc" d="M 772 430 H 856"/>
  <path class="dat"  d="M 772 430 H 856"/>
  <text class="tiny" x="476" y="180" text-anchor="middle">one hub port</text>
  <text class="tiny" x="476" y="194" text-anchor="middle">per board</text>
  <text class="wlbl" x="814" y="176" text-anchor="middle">DATA</text>
  <text class="tiny" x="814" y="189" text-anchor="middle">+ GND pairs</text>
  <rect class="box" x="856" y="168" width="256" height="92" rx="5"/>
  <text class="wlbl" x="872" y="192">Zone 1 &#183; living room</text>
  <text class="tiny" x="1096" y="192" text-anchor="end">A ch 0-7</text>
  <text class="tiny" x="872" y="210">8 runs, 30.7 A &#183; on the S-300-5 (60 A)</text>
  <path class="pwr" d="M 872 230 H 1096"/>
  <path class="gnd" d="M 872 252 H 1096"/>
  <text class="tiny" x="1096" y="226" text-anchor="end">+5 V, local</text>
  <text class="tiny" x="880" y="242">GND, local - tied to that board&#39;s &#8722; pins</text>
  <rect class="box" x="856" y="276" width="256" height="92" rx="5"/>
  <text class="wlbl" x="872" y="300">Zone 2 &#183; kitchen / hall</text>
  <text class="tiny" x="1096" y="300" text-anchor="end">B ch 0-3</text>
  <text class="tiny" x="872" y="318">4 runs, 15.4 A &#183; same S-300-5: 46.1 A, 77 %</text>
  <path class="pwr" d="M 872 338 H 1096"/>
  <path class="gnd" d="M 872 360 H 1096"/>
  <text class="tiny" x="1096" y="334" text-anchor="end">+5 V, local</text>
  <text class="tiny" x="880" y="350">GND, local - tied to that board&#39;s &#8722; pins</text>
  <rect class="box" x="856" y="384" width="256" height="92" rx="5"/>
  <text class="wlbl" x="872" y="408">Zone 3 &#183; bedroom</text>
  <text class="tiny" x="1096" y="408" text-anchor="end">C ch 0-5</text>
  <text class="tiny" x="872" y="426">6 runs, 23.0 A &#183; S-150-5 (30 A), 77 %</text>
  <path class="pwr" d="M 872 446 H 1096"/>
  <path class="gnd" d="M 872 468 H 1096"/>
  <text class="tiny" x="1096" y="442" text-anchor="end">+5 V, local</text>
  <text class="tiny" x="880" y="458">GND, local - tied to that board&#39;s &#8722; pins</text>
  <text class="warnt" x="66" y="502">Bond the two supplies&#8217; V&#8722; terminals to each other. Required, not optional.</text>
  <text class="tiny" x="66" y="520">The boards and the hub already tie these two supply grounds together through 24-26 AWG</text>
  <text class="tiny" x="66" y="534">signal returns. The bond stops that thin path being the only tie: in parallel it is about</text>
  <text class="tiny" x="66" y="548">0.004 &#937; against roughly 0.7 &#937;, so over 99 % of any current between zones takes the bond.</text>
  <text class="tiny" x="66" y="566">It does NOT cover a GND feeder coming loose at its supply - there it is in series with the</text>
  <text class="tiny" x="66" y="580">thin grounds, not parallel. Ferrule and torque every GND termination. See &#167; 5.3.</text>
  <rect class="box" x="660" y="498" width="170" height="70" rx="5"/>
  <text class="wlbl" x="745" y="522" text-anchor="middle">sompom S-300-5</text>
  <text class="tiny" x="745" y="538" text-anchor="middle">60 A &#183; zones 1 and 2</text>
  <rect class="box" x="970" y="498" width="170" height="70" rx="5"/>
  <text class="wlbl" x="1055" y="522" text-anchor="middle">LETOUR S-150-5</text>
  <text class="tiny" x="1055" y="538" text-anchor="middle">30 A &#183; zone 3</text>
  <path class="bond" d="M 830 552 H 970"/>
  <rect x="822" y="546" width="14" height="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.6"/>
  <rect x="964" y="546" width="14" height="12" fill="#FFFFFF" stroke="#111111" stroke-width="1.6"/>
  <text class="tiny" x="900" y="540" text-anchor="middle">8 AWG V&#8722; to V&#8722;</text>
  <text class="tiny" x="900" y="582" text-anchor="middle">never tie the V+ outputs</text>
  <text class="warnt" x="66" y="596">Do not hang three boards off the Pi&#8217;s own USB ports.</text>
  <text class="tiny" x="66" y="614">The Pi 3B+ shares roughly 1.2 A across all four of its ports, and a</text>
  <text class="tiny" x="66" y="628">brown-out on one board can take the Pi down with it. A hub with its</text>
  <text class="tiny" x="66" y="642">own supply removes the question entirely.</text>
  <text class="tiny" x="66" y="662">Widely cited figure from Raspberry Pi community sources; not confirmed against official docs.</text>
  <text class="warnt" x="620" y="596">Bandwidth is not your constraint. Cable length is.</text>
  <text class="tiny" x="620" y="614">Each Fadecandy is a full-speed 12 Mbps device. Three of them together are</text>
  <text class="tiny" x="620" y="628">nowhere near saturating a USB 2.0 bus. But USB allows 5 m per passive</text>
  <text class="tiny" x="620" y="642">segment: Pi to hub is one, hub to board is another. A second powered hub</text>
  <text class="tiny" x="620" y="662">buys another segment. Keep hubs out of any enclosure that holds an open-frame mains supply.</text>
  <rect class="pan" x="40" y="696" width="628" height="414" rx="6"/>
  <text class="panttl" x="66" y="726">How fcserver addresses each board</text>
  <text class="lbls" x="66" y="745">A device entry with no "serial" key matches any Fadecandy. That is fine with</text>
  <text class="lbls" x="66" y="761">one board and ambiguous with three, so name them.</text>
  <rect class="code" x="66" y="774" width="576" height="318" rx="4"/>
  <text class="monos" x="80" y="794" xml:space="preserve">{</text>
  <text class="monos" x="80" y="811" xml:space="preserve">&#160;&#160;"listen":&#160;[null,&#160;7890],</text>
  <text class="monos" x="80" y="828" xml:space="preserve">&#160;&#160;"verbose":&#160;true,</text>
  <text class="monos" x="80" y="845" xml:space="preserve">&#160;&#160;"color":&#160;{&#160;"gamma":&#160;2.5,&#160;"whitepoint":&#160;[1.0,&#160;1.0,&#160;1.0]&#160;},</text>
  <text class="monos" x="80" y="862" xml:space="preserve">&#160;&#160;"devices":&#160;[</text>
  <text class="monos" x="80" y="879" xml:space="preserve">&#160;&#160;&#160;&#160;{&#160;"type":&#160;"fadecandy",</text>
  <text class="monos" x="80" y="896" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;"serial":&#160;"FFFFFFFFFFFF00180017200214134D44",</text>
  <text class="monos" x="80" y="913" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;"map":&#160;[&#160;[&#160;0,&#160;0,&#160;&#160;&#160;&#160;0,&#160;512&#160;]&#160;]&#160;},</text>
  <text class="monos" x="80" y="930" xml:space="preserve"></text>
  <text class="monos" x="80" y="947" xml:space="preserve">&#160;&#160;&#160;&#160;{&#160;"type":&#160;"fadecandy",</text>
  <text class="monos" x="80" y="964" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;"serial":&#160;"FFFFFFFFFFFF0021003B200314134D44",</text>
  <text class="monos" x="80" y="981" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;"map":&#160;[&#160;[&#160;0,&#160;512,&#160;&#160;0,&#160;256&#160;]&#160;]&#160;},</text>
  <text class="monos" x="80" y="998" xml:space="preserve"></text>
  <text class="monos" x="80" y="1015" xml:space="preserve">&#160;&#160;&#160;&#160;{&#160;"type":&#160;"fadecandy",</text>
  <text class="monos" x="80" y="1032" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;"serial":&#160;"FFFFFFFFFFFF00340052200914134D44",</text>
  <text class="monos" x="80" y="1049" xml:space="preserve">&#160;&#160;&#160;&#160;&#160;&#160;"map":&#160;[&#160;[&#160;0,&#160;768,&#160;&#160;0,&#160;384&#160;]&#160;]&#160;}</text>
  <text class="monos" x="80" y="1066" xml:space="preserve">&#160;&#160;]</text>
  <text class="monos" x="80" y="1083" xml:space="preserve">}</text>
  <rect class="note" x="688" y="696" width="452" height="414" rx="6"/>
  <text class="notet" x="710" y="724">Reading a map entry</text>
  <text class="mono" x="710" y="748" xml:space="preserve">[ OPC_channel, first_OPC_px,</text>
  <text class="mono" x="710" y="766" xml:space="preserve">  first_device_px, count ]</text>
  <text class="notep" x="710" y="792">A Fadecandy&#39;s own pixels are numbered 0 to 511.</text>
  <text class="notep" x="710" y="809">Strand 1 starts at 0, strand 2 at 64, strand 3 at</text>
  <text class="notep" x="710" y="826">128, and so on. So on board C, count 384 means its</text>
  <text class="notep" x="710" y="843">first six strands, which are runs 13 to 18.</text>
  <text class="notet" x="710" y="876">Finding the serial numbers</text>
  <text class="notep" x="710" y="900">Plug in one board at a time and run fcserver with</text>
  <text class="notep" x="710" y="917">"verbose": true. It prints the serial of each device</text>
  <text class="notep" x="710" y="934">it opens. Write that on a label and stick it to the</text>
  <text class="notep" x="710" y="951">board before you plug in the next one.</text>
  <text class="notet" x="710" y="984">Why serials and not port order</text>
  <text class="notep" x="710" y="1008">USB enumeration order is not stable. Address boards</text>
  <text class="notep" x="710" y="1025">by port and your living room becomes your bedroom</text>
  <text class="notep" x="710" y="1042">after a reboot. Address by serial and a board keeps</text>
  <text class="notep" x="710" y="1059">its zone whichever socket it lands in.</text>
  <text class="warnt" x="710" y="1074">Label the boards. You will not remember which</text>
  <text class="warnt" x="710" y="1091">hex string is the one in the hall.</text>
</svg>
