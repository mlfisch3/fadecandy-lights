<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1136" width="1180" height="1136"
     role="img" aria-labelledby="t5 d5">
  <title id="t5">Three Fadecandy boards on a powered USB hub, driving all eighteen runs</title>
  <desc id="d5">The Raspberry Pi 3B+ connects to a powered USB hub. Three Fadecandy boards hang off
  the hub, giving 24 output channels of which 18 are used. Each board is addressed in the fcserver
  configuration by its own USB serial number, and each board's channels map to a slice of the Open
  Pixel Control pixel space. The eighteen runs are grouped into three zones: the living room takes
  all eight channels of board A, the kitchen and hall take board B channels 0 to 3, and the bedroom
  takes all six used channels of board C, so that no board spans two supplies. The 60 A supply feeds
  the living room and the kitchen and hall together; the 30 A supply feeds the bedroom alone, and the
  two supplies' V-minus terminals are bonded to each other with 8 AWG, so that the boards' thin
  signal grounds are not the only tie between the two supply grounds. Alongside: how to read
  the serial numbers off the boards, how to read a map entry, and the power and cable-length
  constraints on the USB side.</desc>

