<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 880" width="1180" height="880"
     role="img" aria-labelledby="t2 d2">
  <title id="t2">One Fadecandy channel wired to one 64-pixel run, with the common ground shown</title>
  <desc id="d2">Fadecandy channel 0 drives one 64-pixel WS2812B run. A yellow DATA wire runs from the
  channel's + pad to the run's DI pigtail. A black GND wire runs from the same channel's minus pad
  and joins the run's black pigtail lead at a junction. From that junction the black lead continues
  to the supply's V-minus terminal, and the run's red lead goes to V-plus through that run's own 5 A
  branch fuse. The Fadecandy carries no strip current; it only shares the ground reference.</desc>

  <style>
    .bg      { fill:#F7F6F1; stroke:#C7C3B8; stroke-width:2; }
    .ttl     { font:700 25px ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#15140F; }
    .sub     { font:400 14.5px ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#4A4740; }
    .lbl     { font:600 13px ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#15140F; }
    .lbls    { font:400 11.5px ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#4A4740; }
    .wlbl    { font:700 11px ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#15140F; }
    .boxttl  { font:700 15px ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#15140F; }
    .mono    { font:600 11px ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace; fill:#15140F; }
    .monos   { font:400 10.5px ui-monospace,'SFMono-Regular',Consolas,'Liberation Mono',monospace; fill:#3A382F; }
    .pinnum  { font:700 12px ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#15140F; }

    .box     { fill:#FFFFFF; stroke:#37342C; stroke-width:2; }
    .panel   { fill:#EFEDE5; stroke:#B9B5A8; stroke-width:1.5; }
    .inset   { fill:#FFFFFF; stroke:#B9B5A8; stroke-width:1.5; stroke-dasharray:5 4; }
    .chip    { fill:#EFEDE5; stroke:#37342C; stroke-width:1.6; }
    .fuse    { fill:#FFFFFF; stroke:#37342C; stroke-width:1.8; }
    .strip   { fill:#FFFFFF; stroke:#37342C; stroke-width:2; }
    .led     { fill:#E8E4D6; stroke:#9A9587; stroke-width:0.8; }
    .padd    { fill:#FFF3CE; stroke:#4A3800; stroke-width:1.6; }
    .padg    { fill:#E4E2DA; stroke:#111111; stroke-width:1.6; }

    .gnd     { stroke:#111111; stroke-width:3.6; fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .pwr     { stroke:#CE2318; stroke-width:3.6; fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .datc    { stroke:#4A3800; stroke-width:7;   fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .dat     { stroke:#F5B70A; stroke-width:3.6; fill:none; stroke-linejoin:round; stroke-linecap:round; }
    .lead    { stroke:#8A857A; stroke-width:1.2; fill:none; stroke-dasharray:4 3; }
    .brk     { stroke:#8A857A; stroke-width:1.2; fill:none; }
    .sig     { stroke:#37342C; stroke-width:2; fill:none; }

    .dot     { fill:#111111; }
    .note    { fill:#FFF9E3; stroke:#C9A227; stroke-width:1.6; }
    .notet   { font:600 12.5px ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#3D3200; }
    .notep   { font:400 12.5px ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#3D3200; }
    .warn    { fill:#FFEFEC; stroke:#CE2318; stroke-width:1.8; }
    .warnt   { font:700 12.5px ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#7A140C; }
    .warnp   { font:400 12.5px ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#7A140C; }
    .hl      { fill:none; stroke:#0B7285; stroke-width:2.4; }
    .hlt     { font:700 12px ui-sans-serif,system-ui,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill:#0B5A69; }
