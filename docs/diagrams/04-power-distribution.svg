<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 1244" width="1180" height="1244"
     role="img" aria-labelledby="t4 d4">
  <title id="t4">Power distribution and injection: fanning one 5 V supply out to several runs</title>
  <desc id="d4">One 5 V supply feeds a main fuse, then a pair of distribution bus bars. Each run takes
  a fused red branch from the plus bus and returns on a black branch to the minus bus; data and its
  ground arrive separately from the Fadecandy. Alongside: current per run, supply headroom,
  conductor ampacity and fuse sizing, running cost, and when power injection into the far end of a
  run is actually needed.</desc>

  <style>
