[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fclights"
version = "1.0.0"
description = "Fadecandy/WS2812B lighting controller for Raspberry Pi, with a LAN control API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

# Deliberately short. Everything here has prebuilt aarch64 (and armv7l) wheels,
# so a fresh Raspberry Pi OS install never has to compile anything.
dependencies = [
    "numpy>=1.24",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "websockets>=12",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
fclights = "fclights.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:fclights.*"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["B008"]
